name: Build dsperate

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'dsperate-lr git ref (commit/tag/branch, blank for latest)'
        default: ''
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      # dsperate-lr's own image is Ubuntu 24.04 (glibc 2.39). Noxwell-spruce's is focal with GCC 10 (glibc 2.31).
      - name: Build Docker image
        run: |
          git clone --depth 1 https://github.com/spruceUI/Noxwell-spruce.git noxwell-spruce
          docker build -t dsperate-builder noxwell-spruce

      - name: Clone dsperate-lr
        run: |
          git clone https://github.com/thwonp/dsperate-lr.git dsperate-lr
          REF="${{ inputs.core_ref }}"
          if [ -n "$REF" ]; then
            git -C dsperate-lr checkout "$REF"
          fi
          git -C dsperate-lr submodule update --init --recursive
          echo "DSperate: $(git -C dsperate-lr/DSperate describe --tags --always)"

      # PGO off: the committed profile is for GCC 13.3.
      - name: Build arm64
        run: |
          mkdir -p output/cores64
          docker run --rm --entrypoint bash -v ${{ github.workspace }}/dsperate-lr:/src -v ${{ github.workspace }}/output:/output -w /src dsperate-builder -c '
            set -e
            git config --global --add safe.directory "*"
            X=aarch64-linux-gnu
            export DSP_CC=$(command -v $X-gcc-10) DSP_CXX=$(command -v $X-g++-10)
            export DSP_AR=$(command -v $X-gcc-ar-10) DSP_RANLIB=$(command -v $X-gcc-ranlib-10) DSP_NM=$(command -v $X-gcc-nm-10) DSP_STRIP=$(command -v $X-strip)
            export CCACHE_DIR=/tmp/ccache
            FLAGS="-O3 -mtune=cortex-a55 -pthread -I/opt/vulkan-headers/include"
            LINK="-pthread -static-libstdc++ -static-libgcc -mtune=cortex-a55"
            for p in /src/patches/*.patch; do
              [ -e "$p" ] || continue
              git -C DSperate apply --reverse --check "$p" 2>/dev/null && continue
              git -C DSperate apply "$p"
            done
            cmake -S DSperate -B build/dsperate -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=/toolchain-aarch64.cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PROJECT_INCLUDE=/src/cmake/dsperate-pic.cmake \
              -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS" \
              -DDSPERATE_PGO=OFF -DDSPERATE_JIT=ON -DDSPERATE_NEON=ON \
              -DDSPERATE_TESTS=OFF -DDSPERATE_HEADLESS=OFF -DDSPERATE_SDL=OFF \
              -DDSPERATE_WAYLAND=OFF -DDSPERATE_CHEEVOS=OFF -DDSPERATE_NET=OFF
            grep -q -- "-DDSPERATE_JIT=1" build/dsperate/compile_commands.json || { echo "::error::JIT not compiled in"; exit 1; }
            grep -q -- "-DDSPERATE_NEON=1" build/dsperate/compile_commands.json || { echo "::error::NEON not compiled in"; exit 1; }
            cmake --build build/dsperate --target dsperate_core -j$(nproc)
            cmake -S . -B build/lr -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=/toolchain-aarch64.cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS" -DCMAKE_SHARED_LINKER_FLAGS="$LINK" \
              -DDSPERATE_BUILD=/src/build/dsperate
            cmake --build build/lr
            $X-strip --strip-unneeded -o /output/cores64/dsperate_libretro.so build/lr/dsperate_libretro.so
          '

      - name: Check architecture and ABI floor
        run: |
          so=output/cores64/dsperate_libretro.so
          file "$so"
          file "$so" | grep -q aarch64 || { echo "::error::arm64 build is not aarch64"; exit 1; }
          NEWEST=$(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "Newest glibc symbol: $NEWEST"
          if [ "$(printf '%s\n' "$NEWEST" GLIBC_2.31 | sort -V | tail -1)" != GLIBC_2.31 ]; then
            echo "::error::needs $NEWEST, spruce's aarch64 floor is glibc 2.31"
            exit 1
          fi
          if objdump -T "$so" | grep -q 'GLIBCXX_\|CXXABI_'; then
            echo "::error::dynamic libstdc++ symbols despite -static-libstdc++"
            exit 1
          fi

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          cat > dsperate_libretro.info <<'EOF'
          display_name = "Nintendo - DS (DSperate)"
          authors = "beebono|thwonp"
          supported_extensions = "nds"
          corename = "DSperate"
          license = "GPLv3"
          permissions = ""
          display_version = "dsperate-lr"
          manufacturer = "Nintendo"
          systemname = "Nintendo DS"
          systemid = "nds"
          EOF
          zip -r dsperate_libretro.zip cores64/ dsperate_libretro.info
          gh release upload "beta-${{ github.ref_name }}" dsperate_libretro.zip --clobber
