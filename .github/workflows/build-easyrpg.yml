name: Build easyrpg

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core git ref (commit/tag/branch); default: the commit cores-experimental tested, blank for latest'
        default: '0582a5eb8a442824c8aad0495443824b3c8afb08'
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: '0582a5eb8a442824c8aad0495443824b3c8afb08'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      - name: Download Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download toolchains --pattern "cores-arm64.tar.gz" --dir .
          gh release download toolchains --pattern "cores-armhf.tar.gz" --dir .

      - name: Load Docker images
        run: |
          gunzip -c cores-arm64.tar.gz | docker load
          gunzip -c cores-armhf.tar.gz | docker load

      # scripts/build-easyrpg.sh: cores-experimental's recipe, with its static dependencies built in the image.
      - name: Build arm64
        env:
          CORE_REF: ${{ inputs.core_ref }}
        run: |
          mkdir -p output/cores64
          docker run --rm -v ${{ github.workspace }}:/work:ro -v ${{ github.workspace }}/output:/output cores-arm64 \
            bash /work/scripts/build-easyrpg.sh arm64 "$CORE_REF" /output/cores64
      - name: Build armhf
        env:
          CORE_REF: ${{ inputs.core_ref }}
        run: |
          mkdir -p output/cores
          docker run --rm -v ${{ github.workspace }}:/work:ro -v ${{ github.workspace }}/output:/output cores-armhf \
            bash /work/scripts/build-easyrpg.sh armhf "$CORE_REF" /output/cores
      - name: Grab info file
        run: |
          docker run --rm -v ${{ github.workspace }}/output:/output cores-arm64 \
            bash -c 'cp dist/info/easyrpg_libretro.info /output/ 2>/dev/null || true'

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          CONTENTS=""
          [ -f cores64/easyrpg_libretro.so ] && CONTENTS="$CONTENTS cores64/"
          [ -f cores/easyrpg_libretro.so ] && CONTENTS="$CONTENTS cores/"
          [ -f easyrpg_libretro.info ] && CONTENTS="$CONTENTS easyrpg_libretro.info"
          if [ -n "$CONTENTS" ]; then
            zip -r easyrpg_libretro.zip $CONTENTS
            gh release upload "beta-${{ github.ref_name }}" easyrpg_libretro.zip --clobber
          else
            echo "::error::No builds succeeded for easyrpg"
            exit 1
          fi
