name: Build armn64

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core git ref (commit/tag/branch, blank for latest)'
        default: ''
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      - name: Download Docker image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download toolchains --pattern "cores-arm64.tar.gz" --dir .

      - name: Load Docker image
        run: gunzip -c cores-arm64.tar.gz | docker load

      - name: Clone armN64
        run: |
          git clone https://github.com/MagnominusGit/armN64.git armn64
          REF="${{ inputs.core_ref }}"
          if [ -n "$REF" ]; then
            git -C armn64 checkout "$REF"
          fi
          git -C armn64 submodule update --init --recursive
          mkdir -p output/cores64
          cp armn64/libretro/armn64_libretro.info output/

      # No armhf: 32-bit ARM has no recompiler. ARMN64_TUNE targets ARMv8.2, which the A133 and H700 lack.
      - name: Build arm64
        run: |
          docker run --rm -v ${{ github.workspace }}/armn64:/armn64 -v ${{ github.workspace }}/output:/output -w /armn64 cores-arm64 \
            bash -c '
              cmake -S . -B build-arm64 -DCMAKE_BUILD_TYPE=Release -DARMN64_TUNE=OFF \
              && cmake --build build-arm64 -j$(nproc) \
              && cp build-arm64/armn64_libretro.so /output/cores64/
            '

      - name: Check architecture and glibc floor
        run: |
          so=output/cores64/armn64_libretro.so
          file "$so"
          file "$so" | grep -q aarch64 || { echo "::error::arm64 build is not aarch64"; exit 1; }
          echo "Newest glibc symbol: $(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          zip -r armn64_libretro.zip cores64/ armn64_libretro.info
          gh release upload "beta-${{ github.ref_name }}" armn64_libretro.zip --clobber
