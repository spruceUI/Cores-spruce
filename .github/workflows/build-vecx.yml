name: Build vecx

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core git ref (commit/tag/branch); default: the commit cores-experimental tested, blank for latest'
        default: '8f671cc9d737f2890c3ce19e177e2984dcae121f'
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: '8f671cc9d737f2890c3ce19e177e2984dcae121f'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      - name: Download Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download toolchains --pattern "cores-arm64.tar.gz" --dir .
          gh release download toolchains --pattern "cores-armhf.tar.gz" --dir .

      - name: Load Docker images
        run: |
          gunzip -c cores-arm64.tar.gz | docker load
          gunzip -c cores-armhf.tar.gz | docker load

      - name: Build arm64
        run: |
          mkdir -p output/cores64
          docker run --rm -v ${{ github.workspace }}/output:/output cores-arm64 \
            bash -c '
              set -e
              ./libretro-fetch.sh vecx
              REF="${{ inputs.core_ref }}"
              if [ -n "$REF" ]; then
                git -C libretro-vecx fetch origin "$REF"
                git -C libretro-vecx checkout --detach FETCH_HEAD
                git -C libretro-vecx submodule update --init --recursive
              fi
              export MAKEFLAGS="HAS_GPU=0"
              ./libretro-build.sh vecx
              cp dist/unix/vecx_libretro.so /output/cores64/
            '
      - name: Build armhf
        run: |
          mkdir -p output/cores
          docker run --rm -v ${{ github.workspace }}/output:/output cores-armhf \
            bash -c '
              set -e
              ./libretro-fetch.sh vecx
              REF="${{ inputs.core_ref }}"
              if [ -n "$REF" ]; then
                git -C libretro-vecx fetch origin "$REF"
                git -C libretro-vecx checkout --detach FETCH_HEAD
                git -C libretro-vecx submodule update --init --recursive
              fi
              export MAKEFLAGS="HAS_GPU=0"
              ./libretro-build.sh vecx
              cp dist/unix/vecx_libretro.so /output/cores/
            '
      - name: Grab info file
        run: |
          docker run --rm -v ${{ github.workspace }}/output:/output cores-arm64 \
            bash -c 'cp dist/info/vecx_libretro.info /output/ 2>/dev/null || true'

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          CONTENTS=""
          [ -f cores64/vecx_libretro.so ] && CONTENTS="$CONTENTS cores64/"
          [ -f cores/vecx_libretro.so ] && CONTENTS="$CONTENTS cores/"
          [ -f vecx_libretro.info ] && CONTENTS="$CONTENTS vecx_libretro.info"
          if [ -n "$CONTENTS" ]; then
            zip -r vecx_libretro.zip $CONTENTS
            gh release upload "beta-${{ github.ref_name }}" vecx_libretro.zip --clobber
          else
            echo "::error::No builds succeeded for vecx"
            exit 1
          fi
