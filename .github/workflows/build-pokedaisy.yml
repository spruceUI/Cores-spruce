name: Build pokedaisy

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core git ref (commit/tag/branch, blank for latest)'
        default: ''
      repo_owner:
        description: 'GitHub user or organization that owns pokedaisy-lr'
        default: 'thwonp'
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: ''
      repo_owner:
        type: string
        default: 'thwonp'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      - name: Download Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download toolchains --pattern "cores-arm64.tar.gz" --dir .
          gh release download toolchains --pattern "cores-armhf.tar.gz" --dir .

      - name: Load Docker images
        run: |
          gunzip -c cores-arm64.tar.gz | docker load
          gunzip -c cores-armhf.tar.gz | docker load

      - name: Clone pokedaisy-lr
        env:
          REPO_OWNER: ${{ inputs.repo_owner }}
        run: |
          git clone --branch main "https://github.com/${REPO_OWNER}/pokedaisy-lr.git" pokedaisy
          REF="${{ inputs.core_ref }}"
          if [ -n "$REF" ]; then
            git -C pokedaisy checkout "$REF"
          fi
          git -C pokedaisy submodule update --init third_party/mgba third_party/armgba third_party/zlib
          git -C pokedaisy submodule update --init --recursive third_party/dsperate-lr
          mkdir -p output
          cat > output/pokedaisy_gbc.info <<'EOF'
          display_name = "Pokemon - PokeDaisy (GB/GBC, mGBA)"
          authors = "thwonp|endrift"
          supported_extensions = "gb|gbc"
          corename = "PokeDaisy"
          categories = "Emulator"
          license = "MPL-2.0"
          permissions = ""
          display_version = "0.3"
          manufacturer = "Nintendo"
          systemname = "Game Boy Color"
          systemid = "gbc"
          database = "Nintendo - Game Boy|Nintendo - Game Boy Color"
          needs_fullpath = "false"
          EOF
          cat > output/pokedaisy_gba.info <<'EOF'
          display_name = "Pokemon - PokeDaisy (GBA, armGBA)"
          authors = "thwonp|endrift"
          supported_extensions = "gba"
          corename = "PokeDaisy"
          categories = "Emulator"
          license = "MPL-2.0"
          permissions = ""
          display_version = "0.3"
          manufacturer = "Nintendo"
          systemname = "Game Boy Advance"
          systemid = "gba"
          database = "Nintendo - Game Boy Advance"
          needs_fullpath = "false"
          EOF
          cat > output/pokedaisy_ds.info <<'EOF'
          display_name = "Pokemon - PokeDaisy (Nintendo DS)"
          authors = "thwonp"
          supported_extensions = "nds"
          corename = "PokeDaisy DS"
          categories = "Emulator"
          license = "MPL-2.0"
          permissions = ""
          display_version = "0.3"
          manufacturer = "Nintendo"
          systemname = "Nintendo DS"
          systemid = "nds"
          database = "Nintendo - Nintendo DS"
          needs_fullpath = "false"
          EOF

      - name: Build arm64
        run: |
          mkdir -p output/cores64
          docker run --rm -v ${{ github.workspace }}/pokedaisy:/pokedaisy -v ${{ github.workspace }}/output:/output -w /pokedaisy cores-arm64 \
            bash -c '
              cmake -S libretro -B build-arm64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/pokedaisy/libretro/aarch64.cmake \
              && cmake --build build-arm64 --target pokedaisy_gbc_libretro -j$(nproc) \
              && cp build-arm64/pokedaisy_gbc_libretro.so /output/cores64/
            ' || echo "::warning::arm64 GBC build failed for pokedaisy"
          docker run --rm -v ${{ github.workspace }}/pokedaisy:/pokedaisy -v ${{ github.workspace }}/output:/output -w /pokedaisy cores-arm64 \
            bash -c '
              cmake -S libretro/armgba -B build-armgba-arm64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/pokedaisy/libretro/aarch64.cmake \
              && cmake --build build-armgba-arm64 --target pokedaisy_gba_libretro -j$(nproc) \
              && cp build-armgba-arm64/pokedaisy_gba_libretro.so /output/cores64/
            ' || echo "::warning::arm64 GBA build failed for pokedaisy"
          git -C pokedaisy/third_party/zlib checkout -- .
          docker run --rm -v ${{ github.workspace }}/pokedaisy:/pokedaisy -v ${{ github.workspace }}/output:/output -w /pokedaisy cores-arm64 \
            bash -c '
              apt-get update \
              && apt-get install -y --no-install-recommends python3 \
              && cmake -S linux/libretro-ds -B build-ds-arm64 -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTING=OFF -DCMAKE_TOOLCHAIN_FILE=/pokedaisy/libretro/aarch64.cmake \
              && cmake --build build-ds-arm64 --target pokedaisy_ds_libretro -j$(nproc) \
              && cp build-ds-arm64/pokedaisy_ds_libretro.so /output/cores64/
            ' || echo "::warning::arm64 DS build failed for pokedaisy"

      - name: Build armhf
        run: |
          mkdir -p output/cores
          docker run --rm -v ${{ github.workspace }}/pokedaisy:/pokedaisy -v ${{ github.workspace }}/output:/output -w /pokedaisy cores-armhf \
            bash -c '
              cmake -S libretro -B build-armhf -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="-mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard" \
                -DCMAKE_CXX_FLAGS="-mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard" \
              && cmake --build build-armhf --target pokedaisy_gbc_libretro -j$(nproc) \
              && cp build-armhf/pokedaisy_gbc_libretro.so /output/cores/
            ' || echo "::warning::armhf GBC build failed for pokedaisy"
          docker run --rm -v ${{ github.workspace }}/pokedaisy:/pokedaisy -v ${{ github.workspace }}/output:/output -w /pokedaisy cores-armhf \
            bash -c '
              cmake -S libretro/armgba -B build-armgba-armhf -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="-mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard" \
                -DCMAKE_CXX_FLAGS="-mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard" \
              && cmake --build build-armgba-armhf --target pokedaisy_gba_libretro -j$(nproc) \
              && cp build-armgba-armhf/pokedaisy_gba_libretro.so /output/cores/
            ' || echo "::warning::armhf GBA build failed for pokedaisy"
          git -C pokedaisy/third_party/zlib checkout -- .
          docker run --rm -v ${{ github.workspace }}/pokedaisy:/pokedaisy -v ${{ github.workspace }}/output:/output -w /pokedaisy cores-armhf \
            bash -c '
              apt-get update \
              && apt-get install -y --no-install-recommends python3 \
              && cmake -S linux/libretro-ds -B build-ds-armhf -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTING=OFF \
                -DCMAKE_C_FLAGS="-mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard" \
                -DCMAKE_CXX_FLAGS="-mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard" \
              && cmake --build build-ds-armhf --target pokedaisy_ds_libretro -j$(nproc) \
              && cp build-ds-armhf/pokedaisy_ds_libretro.so /output/cores/
            ' || echo "::warning::armhf DS build failed for pokedaisy"

      - name: Check architectures and glibc floor
        run: |
          for so in output/cores64/*.so output/cores/*.so; do
            [ -f "$so" ] || continue
            file "$so"
            echo "Newest glibc symbol: $(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
          done
          for so in output/cores64/*.so; do
            [ -f "$so" ] || continue
            file "$so" | grep -q aarch64 || { echo "::error::arm64 build is not aarch64: $so"; exit 1; }
          done
          for so in output/cores/*.so; do
            [ -f "$so" ] || continue
            file "$so" | grep -q 'ARM, EABI5' || { echo "::error::armhf build is not 32-bit ARM: $so"; exit 1; }
            NEWEST=$(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
            if [ "$(printf '%s\n' "$NEWEST" GLIBC_2.23 | sort -V | tail -1)" != GLIBC_2.23 ]; then
              echo "::error::armhf needs $NEWEST, A30 has glibc 2.23: $so"
              exit 1
            fi
          done

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          CONTENTS=""
          [ -d cores64 ] && ls cores64/*.so >/dev/null 2>&1 && CONTENTS="$CONTENTS cores64/"
          [ -d cores ] && ls cores/*.so >/dev/null 2>&1 && CONTENTS="$CONTENTS cores/"
          for pair in "pokedaisy_gbc_libretro.so:pokedaisy_gbc.info" "pokedaisy_gba_libretro.so:pokedaisy_gba.info" "pokedaisy_ds_libretro.so:pokedaisy_ds.info"; do
            core="${pair%%:*}"
            info="${pair#*:}"
            if [ -f "cores64/$core" ] || [ -f "cores/$core" ]; then
              CONTENTS="$CONTENTS $info"
            fi
          done
          if [ -n "$CONTENTS" ]; then
            rm -f pokedaisy_libretro.zip
            zip -r pokedaisy_libretro.zip $CONTENTS
            gh release upload "beta-${{ github.ref_name }}" pokedaisy_libretro.zip --clobber
          else
            echo "::error::No builds succeeded for pokedaisy"
            exit 1
          fi
