name: Build ffmpeg

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core git ref (commit/tag/branch); default: the commit cores-experimental tested, blank for latest'
        default: '4920879d2f09a78cdf855403c349457cee1c31da'
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: '4920879d2f09a78cdf855403c349457cee1c31da'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      - name: Download Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download toolchains --pattern "cores-arm64.tar.gz" --dir .
          gh release download toolchains --pattern "cores-armhf.tar.gz" --dir .

      - name: Load Docker images
        run: |
          gunzip -c cores-arm64.tar.gz | docker load
          gunzip -c cores-armhf.tar.gz | docker load

      - name: Build arm64
        run: |
          mkdir -p output/cores64
          docker run --rm -v ${{ github.workspace }}/output:/output cores-arm64 \
            bash -c '
              set -e
              ./libretro-fetch.sh ffmpeg
              REF="${{ inputs.core_ref }}"
              if [ -n "$REF" ]; then
                git -C libretro-ffmpeg fetch origin "$REF"
                git -C libretro-ffmpeg checkout --detach FETCH_HEAD
                git -C libretro-ffmpeg submodule update --init --recursive
              fi
              export MAKEFLAGS="--output-sync=recurse ARCH_AARCH64=0 ARCH_ARM=0 ARCH_X86=0 ARCH_X86_64=0 HAVE_SSA=0 LIBRETRO_EMBED_FFMPEG=1 OPENGL=0"
              ./libretro-build.sh ffmpeg
              cp dist/unix/ffmpeg_libretro.so /output/cores64/
            '
      - name: Build armhf
        run: |
          mkdir -p output/cores
          docker run --rm -v ${{ github.workspace }}/output:/output cores-armhf \
            bash -c '
              set -e
              ./libretro-fetch.sh ffmpeg
              REF="${{ inputs.core_ref }}"
              if [ -n "$REF" ]; then
                git -C libretro-ffmpeg fetch origin "$REF"
                git -C libretro-ffmpeg checkout --detach FETCH_HEAD
                git -C libretro-ffmpeg submodule update --init --recursive
              fi
              export MAKEFLAGS="--output-sync=recurse ARCH_AARCH64=0 ARCH_ARM=0 ARCH_X86=0 ARCH_X86_64=0 HAVE_SSA=0 LIBRETRO_EMBED_FFMPEG=1 OPENGL=0"
              ./libretro-build.sh ffmpeg
              cp dist/unix/ffmpeg_libretro.so /output/cores/
            '
      - name: Grab info file
        run: |
          docker run --rm -v ${{ github.workspace }}/output:/output cores-arm64 \
            bash -c 'cp dist/info/ffmpeg_libretro.info /output/ 2>/dev/null || true'

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          CONTENTS=""
          [ -f cores64/ffmpeg_libretro.so ] && CONTENTS="$CONTENTS cores64/"
          [ -f cores/ffmpeg_libretro.so ] && CONTENTS="$CONTENTS cores/"
          [ -f ffmpeg_libretro.info ] && CONTENTS="$CONTENTS ffmpeg_libretro.info"
          if [ -n "$CONTENTS" ]; then
            zip -r ffmpeg_libretro.zip $CONTENTS
            gh release upload "beta-${{ github.ref_name }}" ffmpeg_libretro.zip --clobber
          else
            echo "::error::No builds succeeded for ffmpeg"
            exit 1
          fi
