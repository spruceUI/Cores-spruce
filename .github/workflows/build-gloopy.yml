name: Build gloopy

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core git ref (commit/tag/branch, blank for latest)'
        default: ''
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      - name: Download Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download toolchains --pattern "cores-arm64.tar.gz" --dir .
          gh release download toolchains --pattern "cores-armhf.tar.gz" --dir .

      - name: Load Docker images
        run: |
          gunzip -c cores-arm64.tar.gz | docker load
          gunzip -c cores-armhf.tar.gz | docker load

      - name: Clone gloopy
        run: |
          git clone https://github.com/seriamaugenlicher/gloopy.git
          REF="${{ inputs.core_ref }}"
          if [ -n "$REF" ]; then
            git -C gloopy checkout "$REF"
          fi
          mkdir -p output
          cp gloopy/gloopy_libretro.info output/

      - name: Build arm64
        run: |
          mkdir -p output/cores64
          docker run --rm -v ${{ github.workspace }}/gloopy:/gloopy -v ${{ github.workspace }}/output:/output -w /gloopy cores-arm64 \
            bash -c '
              make -f Makefile.libretro platform=unix BUILD_TAG=arm64 -j$(nproc) \
                CC="aarch64-linux-gnu-gcc -march=armv8-a+crc+crypto+simd -mtune=cortex-a53" \
                CXX="aarch64-linux-gnu-g++ -march=armv8-a+crc+crypto+simd -mtune=cortex-a53" \
              && mv gloopy_libretro.so /output/cores64/
            ' || echo "::warning::arm64 build failed for gloopy"

      - name: Build armhf
        run: |
          mkdir -p output/cores
          docker run --rm -v ${{ github.workspace }}/gloopy:/gloopy -v ${{ github.workspace }}/output:/output -w /gloopy cores-armhf \
            bash -c '
              make -f Makefile.libretro platform=unix BUILD_TAG=armhf -j$(nproc) \
                CC="arm-a30-linux-gnueabihf-gcc -mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard" \
                CXX="arm-a30-linux-gnueabihf-g++ -mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard" \
              && mv gloopy_libretro.so /output/cores/
            ' || echo "::warning::armhf build failed for gloopy"

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          CONTENTS=""
          [ -f cores64/gloopy_libretro.so ] && CONTENTS="$CONTENTS cores64/"
          [ -f cores/gloopy_libretro.so ] && CONTENTS="$CONTENTS cores/"
          if [ -n "$CONTENTS" ]; then
            zip -r gloopy_libretro.zip $CONTENTS gloopy_libretro.info
            gh release upload "beta-${{ github.ref_name }}" gloopy_libretro.zip --clobber
          else
            echo "::error::No builds succeeded for gloopy"
            exit 1
          fi
