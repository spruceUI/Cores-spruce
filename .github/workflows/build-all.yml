name: Build All Cores

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger all batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"
          echo "BUILD_ALL_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

          previous_run() {
            gh run list --repo "$REPO" --workflow "$1" --branch "$REF" \
              --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0'
          }

          wait_for_new_run() {
            local workflow="$1"
            local previous="$2"
            local run_id
            for _ in $(seq 1 60); do
              run_id=$(previous_run "$workflow")
              if [ "$run_id" != "0" ] && [ "$run_id" != "$previous" ]; then
                echo "$run_id"
                return 0
              fi
              sleep 2
            done
            echo "::error::Timed out waiting for $workflow to start" >&2
            return 1
          }

          PREVIOUS_1=$(previous_run build-all-1.yml)
          PREVIOUS_2=$(previous_run build-all-2.yml)
          PREVIOUS_3=$(previous_run build-all-3.yml)

          gh workflow run build-all-1.yml --repo "$REPO" --ref "$REF"
          gh workflow run build-all-2.yml --repo "$REPO" --ref "$REF"
          gh workflow run build-all-3.yml --repo "$REPO" --ref "$REF"

          RUN_1=$(wait_for_new_run build-all-1.yml "$PREVIOUS_1")
          RUN_2=$(wait_for_new_run build-all-2.yml "$PREVIOUS_2")
          RUN_3=$(wait_for_new_run build-all-3.yml "$PREVIOUS_3")

          echo "Watching batch runs: $RUN_1, $RUN_2, $RUN_3"
          gh run watch "$RUN_1" --repo "$REPO" --exit-status & PID_1=$!
          gh run watch "$RUN_2" --repo "$REPO" --exit-status & PID_2=$!
          gh run watch "$RUN_3" --repo "$REPO" --exit-status & PID_3=$!

          STATUS=0
          wait "$PID_1" || STATUS=1
          wait "$PID_2" || STATUS=1
          wait "$PID_3" || STATUS=1
          exit "$STATUS"

      - name: Package all newly built cores
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          TAG="beta-${{ github.ref_name }}"
          RELEASE_ID=$(gh api "repos/$REPO/releases/tags/$TAG" --jq .id)

          mkdir -p all-core-zips all-core-extracted all-cores/cores all-cores/cores64 all-cores/info
          gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | [.id, .name, .created_at] | @tsv' > all-core-assets.tsv

          DOWNLOADED=0
          while IFS=$'\t' read -r asset_id asset_name created_at; do
            case "$asset_name" in
              *.zip) ;;
              *) continue ;;
            esac
            [ "$asset_name" != "all-cores.zip" ] || continue
            [[ "$created_at" < "$BUILD_ALL_STARTED_AT" ]] && continue

            safe_name=$(basename "$asset_name")
            [ "$safe_name" = "$asset_name" ] || {
              echo "::error::Unsafe release asset name: $asset_name"
              exit 1
            }
            echo "Adding $asset_name (created $created_at)"
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$REPO/releases/assets/$asset_id" \
              > "all-core-zips/$safe_name"

            extract_dir="all-core-extracted/$asset_id"
            mkdir -p "$extract_dir"
            unzip -oq "all-core-zips/$safe_name" -d "$extract_dir"

            MERGED_FROM_ASSET=0
            for dir in cores cores64 info; do
              for source in \
                "$extract_dir/$dir" \
                "$extract_dir/RetroArch/.retroarch/$dir"; do
                [ -d "$source" ] || continue
                cp -a "$source/." "all-cores/$dir/"
                MERGED_FROM_ASSET=1
              done
            done
            if [ "$MERGED_FROM_ASSET" -eq 0 ]; then
              echo "::warning::$asset_name contained no cores/, cores64/, or info/ folders"
            fi
            DOWNLOADED=$((DOWNLOADED + 1))
          done < all-core-assets.tsv

          if [ "$DOWNLOADED" -eq 0 ]; then
            echo "::error::No core archives were produced by this Build All run"
            exit 1
          fi

          if ! find all-cores -type f -name '*.so' -print -quit | grep -q .; then
            echo "::error::The combined archive contains no core libraries"
            exit 1
          fi

          (cd all-cores && zip -qr ../all-cores.zip cores/ cores64/ info/)
          echo "Packaged $DOWNLOADED newly built core archives:"
          unzip -l all-cores.zip
          gh release upload "$TAG" all-cores.zip --clobber
