name: Build flycast

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core git ref (commit/tag/branch); default: the commit cores-experimental tested, blank for latest'
        default: '392a429e8b040b3e5bf6696cb4f984274fc44123'
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: '392a429e8b040b3e5bf6696cb4f984274fc44123'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      - name: Download Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download toolchains --pattern "cores-arm64.tar.gz" --dir .
          gh release download toolchains --pattern "cores-armhf.tar.gz" --dir .

      - name: Load Docker images
        run: |
          gunzip -c cores-arm64.tar.gz | docker load
          gunzip -c cores-armhf.tar.gz | docker load

      - name: Build arm64
        run: |
          mkdir -p output/cores64
          docker run --rm -v ${{ github.workspace }}/output:/output cores-arm64 \
            bash -c '
              set -e
              ./libretro-fetch.sh flycast
              REF="${{ inputs.core_ref }}"
              if [ -n "$REF" ]; then
                git -C libretro-flycast fetch origin "$REF"
                git -C libretro-flycast checkout --detach FETCH_HEAD
                git -C libretro-flycast submodule update --init --recursive
              fi
              cmake -S libretro-flycast -B build-flycast -DCMAKE_BUILD_TYPE=Release -DLIBRETRO=ON \
                -DCMAKE_POSITION_INDEPENDENT_CODE=TRUE -DUSE_HOST_LIBZIP=OFF -DUSE_OPENMP=OFF \
                -DUSE_VULKAN=OFF -DUSE_GLES=ON
              cmake --build build-flycast --target flycast_libretro -j"$(nproc)"
              cp build-flycast/flycast_libretro.so /output/cores64/
            '
      - name: Build armhf
        run: |
          mkdir -p output/cores
          docker run --rm -v ${{ github.workspace }}/output:/output -v ${{ github.workspace }}/patches:/patches cores-armhf \
            bash -c '
              set -e
              ./libretro-fetch.sh flycast
              REF="${{ inputs.core_ref }}"
              if [ -n "$REF" ]; then
                git -C libretro-flycast fetch origin "$REF"
                git -C libretro-flycast checkout --detach FETCH_HEAD
                git -C libretro-flycast submodule update --init --recursive
              fi
              # GCC 13 libstdc++ linked in and hidden: 32-bit RetroArch on some devices has an older one.
              RUNTIME="-static-libstdc++ -static-libgcc -Wl,--exclude-libs,ALL"
              # The A30 sysroot predates the HWCAP2 names that the lzma in libchdr uses.
              git -C libretro-flycast/core/deps/libchdr apply -p4 --reverse --check /patches/flycast/lzma-hwcap2-guards.patch 2>/dev/null ||
                git -C libretro-flycast/core/deps/libchdr apply -p4 /patches/flycast/lzma-hwcap2-guards.patch
              cmake -S libretro-flycast -B build-flycast -DCMAKE_BUILD_TYPE=Release -DLIBRETRO=ON \
                -DCMAKE_POSITION_INDEPENDENT_CODE=TRUE -DUSE_HOST_LIBZIP=OFF -DUSE_OPENMP=OFF \
                -DUSE_VULKAN=OFF -DUSE_GLES2=ON \
                -DCMAKE_SHARED_LINKER_FLAGS="$RUNTIME" -DCMAKE_MODULE_LINKER_FLAGS="$RUNTIME"
              cmake --build build-flycast --target flycast_libretro -j"$(nproc)"
              cp build-flycast/flycast_libretro.so /output/cores/
            '
      - name: Grab info file
        run: |
          docker run --rm -v ${{ github.workspace }}/output:/output cores-arm64 \
            bash -c 'cp dist/info/flycast_libretro.info /output/ 2>/dev/null || true'

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          CONTENTS=""
          [ -f cores64/flycast_libretro.so ] && CONTENTS="$CONTENTS cores64/"
          [ -f cores/flycast_libretro.so ] && CONTENTS="$CONTENTS cores/"
          [ -f flycast_libretro.info ] && CONTENTS="$CONTENTS flycast_libretro.info"
          if [ -n "$CONTENTS" ]; then
            zip -r flycast_libretro.zip $CONTENTS
            gh release upload "beta-${{ github.ref_name }}" flycast_libretro.zip --clobber
          else
            echo "::error::No builds succeeded for flycast"
            exit 1
          fi
