name: Build yabadabadoo

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core git ref (commit/tag/branch, blank for latest)'
        default: ''
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      - name: Download Docker image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download toolchains --pattern "cores-armhf.tar.gz" --dir .

      - name: Load Docker image
        run: gunzip -c cores-armhf.tar.gz | docker load

      - name: Clone yabadabadoo
        run: |
          git clone https://github.com/ProRapSuperstarOriginalMaster/Yabadabadoo.git yabadabadoo
          REF="${{ inputs.core_ref }}"
          if [ -n "$REF" ]; then
            git -C yabadabadoo checkout "$REF"
          fi
          mkdir -p output
          cp yabadabadoo/packaging/onion/RetroArch/.retroarch/cores/yabadabadoo_libretro.info output/

      # armhf only: the core targets the Cortex-A7 Miyoo Mini and A30.
      - name: Build armhf
        run: |
          mkdir -p output/cores
          docker run --rm -v ${{ github.workspace }}/yabadabadoo:/yabadabadoo -v ${{ github.workspace }}/output:/output -w /yabadabadoo/yabause/src/libretro cores-armhf \
            bash -c '
              make platform=miyoomini -j$(nproc) \
                CC=arm-a30-linux-gnueabihf-gcc \
                CXX=arm-a30-linux-gnueabihf-g++ \
                CC_AS=arm-a30-linux-gnueabihf-gcc \
                AR=arm-a30-linux-gnueabihf-ar \
              && mv yabadabadoo_libretro.so /output/cores/
            '

      - name: Check glibc floor
        run: |
          NEWEST=$(objdump -T output/cores/yabadabadoo_libretro.so | grep -o "GLIBC_[0-9.]*" | sort -Vu | tail -1)
          echo "Newest glibc symbol: $NEWEST"
          if [ "$(printf '%s\n' "$NEWEST" GLIBC_2.23 | sort -V | tail -1)" != GLIBC_2.23 ]; then
            echo "::error::Needs $NEWEST, A30 has glibc 2.23"
            exit 1
          fi

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          zip -r yabadabadoo_libretro.zip cores/ yabadabadoo_libretro.info
          gh release upload "beta-${{ github.ref_name }}" yabadabadoo_libretro.zip --clobber
