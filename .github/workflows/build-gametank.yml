name: Build gametank

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core git ref (commit/tag/branch, blank for latest)'
        default: ''
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Clone gametank-libretro
        run: |
          git clone https://github.com/SundownerSport/gametank-libretro.git
          REF="${{ inputs.core_ref }}"
          if [ -n "$REF" ]; then
            git -C gametank-libretro checkout "$REF"
          fi

      - name: Build arm64
        run: |
          mkdir -p output/cores64
          cd gametank-libretro
          make clean
          make -j"$(nproc)" CXX="zig c++ -target aarch64-linux-gnu.2.23 -mcpu=cortex_a53" \
            && zig objcopy --strip-all gametank_libretro.so ${{ github.workspace }}/output/cores64/gametank_libretro.so \
            || echo "::warning::arm64 build failed for gametank"

      - name: Build armhf
        run: |
          mkdir -p output/cores
          cd gametank-libretro
          make clean
          make -j"$(nproc)" CXX="zig c++ -target arm-linux-gnueabihf.2.23 -mcpu=cortex_a7" \
            && zig objcopy --strip-all gametank_libretro.so ${{ github.workspace }}/output/cores/gametank_libretro.so \
            || echo "::warning::armhf build failed for gametank"

      - name: Grab info file
        run: cp gametank-libretro/gametank_libretro.info output/ 2>/dev/null || true

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          CONTENTS=""
          [ -f cores64/gametank_libretro.so ] && CONTENTS="$CONTENTS cores64/"
          [ -f cores/gametank_libretro.so ] && CONTENTS="$CONTENTS cores/"
          [ -f gametank_libretro.info ] && CONTENTS="$CONTENTS gametank_libretro.info"
          if [ -n "$CONTENTS" ]; then
            zip -r gametank_libretro.zip $CONTENTS
            gh release upload "beta-${{ github.ref_name }}" gametank_libretro.zip --clobber
          else
            echo "::error::No builds succeeded for gametank"
            exit 1
          fi
