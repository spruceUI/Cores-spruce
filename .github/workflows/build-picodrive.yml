name: Build picodrive

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core git ref (commit/tag/branch); default: the commit cores-experimental tested, blank for latest'
        default: 'f0d4a0118a9733a1f10bce5a4ac772c474f9300d'
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: 'f0d4a0118a9733a1f10bce5a4ac772c474f9300d'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      - name: Download Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download toolchains --pattern "cores-arm64.tar.gz" --dir .
          gh release download toolchains --pattern "cores-armhf.tar.gz" --dir .

      - name: Load Docker images
        run: |
          gunzip -c cores-arm64.tar.gz | docker load
          gunzip -c cores-armhf.tar.gz | docker load

      - name: Build arm64
        run: |
          mkdir -p output/cores64
          docker run --rm -v ${{ github.workspace }}/output:/output cores-arm64 \
            bash -c '
              set -e
              ./libretro-fetch.sh picodrive
              REF="${{ inputs.core_ref }}"
              if [ -n "$REF" ]; then
                git -C libretro-picodrive fetch origin "$REF"
                git -C libretro-picodrive checkout --detach FETCH_HEAD
                git -C libretro-picodrive submodule update --init --recursive
              fi
              ./libretro-build.sh picodrive
              cp dist/unix/picodrive_libretro.so /output/cores64/
            '
      - name: Build armhf
        run: |
          mkdir -p output/cores
          docker run --rm -v ${{ github.workspace }}/output:/output cores-armhf \
            bash -c '
              set -e
              ./libretro-fetch.sh picodrive
              REF="${{ inputs.core_ref }}"
              if [ -n "$REF" ]; then
                git -C libretro-picodrive fetch origin "$REF"
                git -C libretro-picodrive checkout --detach FETCH_HEAD
                git -C libretro-picodrive submodule update --init --recursive
              fi
              # The A30 sysroot predates the HWCAP2 names libchdr uses, and the Cyclone
              # generator has to run on the build host.
              export CC="$HOST_CC-gcc" CXX="$HOST_CC-g++" AR="$HOST_CC-ar" RANLIB="$HOST_CC-ranlib"
              export CYCLONE_CC=gcc CYCLONE_CXX=g++ CFLAGS="-DHWCAP2_AES=1 -DHWCAP2_CRC32=16 -DHWCAP2_SHA1=4 -DHWCAP2_SHA2=8" CXXFLAGS="-DHWCAP2_AES=1 -DHWCAP2_CRC32=16 -DHWCAP2_SHA1=4 -DHWCAP2_SHA2=8"
              make -C libretro-picodrive -f Makefile.libretro platform=unix -j"$(nproc)"
              cp libretro-picodrive/picodrive_libretro.so /output/cores/
            '
      - name: Grab info file
        run: |
          docker run --rm -v ${{ github.workspace }}/output:/output cores-arm64 \
            bash -c 'mkdir -p /output/info && cp dist/info/picodrive_libretro.info /output/info/ 2>/dev/null || true'

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          CONTENTS=""
          [ -f cores64/picodrive_libretro.so ] && CONTENTS="$CONTENTS cores64/"
          [ -f cores/picodrive_libretro.so ] && CONTENTS="$CONTENTS cores/"
          [ -f info/picodrive_libretro.info ] && CONTENTS="$CONTENTS info/"
          if [ -n "$CONTENTS" ]; then
            zip -r picodrive_libretro.zip $CONTENTS
            gh release upload "beta-${{ github.ref_name }}" picodrive_libretro.zip --clobber
          else
            echo "::error::No builds succeeded for picodrive"
            exit 1
          fi
