name: Build mupen64plus_next

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core git ref (commit/tag/branch); default: the commit cores-experimental tested, blank for latest'
        default: '98c1b0d877542b01314b3b04272282ba223b65b3'
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: '98c1b0d877542b01314b3b04272282ba223b65b3'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      - name: Download Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download toolchains --pattern "cores-arm64.tar.gz" --dir .
          gh release download toolchains --pattern "cores-armhf.tar.gz" --dir .

      - name: Load Docker images
        run: |
          gunzip -c cores-arm64.tar.gz | docker load
          gunzip -c cores-armhf.tar.gz | docker load

      - name: Build arm64
        run: |
          mkdir -p output/cores64
          docker run --rm -v ${{ github.workspace }}/output:/output cores-arm64 \
            bash -c '
              set -e
              ./libretro-fetch.sh mupen64plus_next
              REF="${{ inputs.core_ref }}"
              if [ -n "$REF" ]; then
                git -C libretro-mupen64plus_next fetch origin "$REF"
                git -C libretro-mupen64plus_next checkout --detach FETCH_HEAD
              fi
              export MAKEFLAGS="FORCE_GLES3=1 WITH_DYNAREC=aarch64"
              ./libretro-build.sh mupen64plus_next
              cp dist/unix/mupen64plus_next_libretro.so /output/cores64/
            '
      - name: Grab info file
        run: |
          docker run --rm -v ${{ github.workspace }}/output:/output cores-arm64 \
            bash -c 'mkdir -p /output/info && cp dist/info/mupen64plus_next_libretro.info /output/info/ 2>/dev/null || true'

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          CONTENTS=""
          [ -f cores64/mupen64plus_next_libretro.so ] && CONTENTS="$CONTENTS cores64/"
          [ -f cores/mupen64plus_next_libretro.so ] && CONTENTS="$CONTENTS cores/"
          [ -f info/mupen64plus_next_libretro.info ] && CONTENTS="$CONTENTS info/"
          if [ -n "$CONTENTS" ]; then
            zip -r mupen64plus_next_libretro.zip $CONTENTS
            gh release upload "beta-${{ github.ref_name }}" mupen64plus_next_libretro.zip --clobber
          else
            echo "::error::No builds succeeded for mupen64plus_next"
            exit 1
          fi
