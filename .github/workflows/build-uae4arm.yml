name: Build uae4arm

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core git ref (commit/tag/branch); default: the commit cores-experimental tested, blank for latest'
        default: 'dafd48fad7510ebc2f90ebdee8331bbdcf65fd49'
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: 'dafd48fad7510ebc2f90ebdee8331bbdcf65fd49'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      - name: Download Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download toolchains --pattern "cores-arm64.tar.gz" --dir .
          gh release download toolchains --pattern "cores-armhf.tar.gz" --dir .

      - name: Load Docker images
        run: |
          gunzip -c cores-arm64.tar.gz | docker load
          gunzip -c cores-armhf.tar.gz | docker load

      - name: Build armhf
        run: |
          mkdir -p output/cores
          docker run --rm -v ${{ github.workspace }}/output:/output cores-armhf \
            bash -c '
              set -e
              ./libretro-fetch.sh uae4arm
              REF="${{ inputs.core_ref }}"
              if [ -n "$REF" ]; then
                git -C libretro-uae4arm fetch origin "$REF"
                git -C libretro-uae4arm checkout --detach FETCH_HEAD
                git -C libretro-uae4arm submodule update --init --recursive
              fi
              # The pinned commit predates Makefile.libretro, which libretro-super now expects.
              mk=Makefile.libretro; [ -f libretro-uae4arm/$mk ] || mk=Makefile
              # GCC 13 libstdc++ linked in and hidden: 32-bit RetroArch on some devices has an older one.
              make -C libretro-uae4arm -f $mk platform=unix -j"$(nproc)" CC="$HOST_CC-gcc" CXX="$HOST_CC-g++" \
                LDFLAGS="-lpthread -static-libstdc++ -static-libgcc -Wl,--exclude-libs,ALL"
              cp libretro-uae4arm/uae4arm_libretro.so /output/cores/
            '
      - name: Grab info file
        run: |
          docker run --rm -v ${{ github.workspace }}/output:/output cores-arm64 \
            bash -c 'mkdir -p /output/info && cp dist/info/uae4arm_libretro.info /output/info/ 2>/dev/null || true'

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          CONTENTS=""
          [ -f cores64/uae4arm_libretro.so ] && CONTENTS="$CONTENTS cores64/"
          [ -f cores/uae4arm_libretro.so ] && CONTENTS="$CONTENTS cores/"
          [ -f info/uae4arm_libretro.info ] && CONTENTS="$CONTENTS info/"
          if [ -n "$CONTENTS" ]; then
            zip -r uae4arm_libretro.zip $CONTENTS
            gh release upload "beta-${{ github.ref_name }}" uae4arm_libretro.zip --clobber
          else
            echo "::error::No builds succeeded for uae4arm"
            exit 1
          fi
