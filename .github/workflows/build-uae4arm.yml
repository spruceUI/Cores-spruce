name: Build uae4arm

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core git ref (commit/tag/branch); default: the commit cores-experimental tested, blank for latest'
        default: 'dafd48fad7510ebc2f90ebdee8331bbdcf65fd49'
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: 'dafd48fad7510ebc2f90ebdee8331bbdcf65fd49'

permissions:
  contents: write

jobs:
  # The 64-bit core spruce ships is Lakka v4.x's RPi3-Composite build: cores-experimental's recipe
  # (scripts/standalone/) rebuilds it with Lakka's own build system, in that repo's image (about 50 minutes).
  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      RECIPE: uae4arm-lakka-rpi3-composite-20240502
      MANIFEST: scripts/standalone/uae4arm.json
    steps:
      - uses: actions/checkout@v4

      - name: Download, check and load the image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found="$(python3 -c 'import json, sys; r = json.load(open(sys.argv[1]))[sys.argv[2]]; print(r["archive"], r["archive_sha256"])' "$MANIFEST" "$RECIPE")"
          read -r archive sha <<< "$found"
          gh release download toolchains -R spruceUI/cores-experimental --pattern "$archive" --dir "$RUNNER_TEMP"
          echo "$sha  $RUNNER_TEMP/$archive" | sha256sum -c -
          # docker load prints the image's tag, or only its ID on a containerd image store.
          image="$(gunzip -c "$RUNNER_TEMP/$archive" | docker load | sed -n 's/^Loaded image\( ID\)\{0,1\}: //p' | tail -1)"
          test -n "$image"
          rm "$RUNNER_TEMP/$archive"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          df -h / | tail -1

      - name: Build
        run: |
          mkdir -p output
          docker run --rm -e OUTPUT_UID="$(id -u)" -e OUTPUT_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/work:ro" -v "$GITHUB_WORKSPACE/output:/output" "$IMAGE" \
            bash -l "/work/scripts/standalone/$RECIPE.sh"

      - name: Check and lay out the card files
        run: python3 scripts/standalone/check.py "$MANIFEST" "$RECIPE" output card

      - uses: actions/upload-artifact@v4
        with:
          name: uae4arm-arm64
          path: card/RetroArch/.retroarch/cores64/uae4arm_libretro.so
          if-no-files-found: error
          include-hidden-files: true

  build:
    needs: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      - name: Download Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download toolchains --pattern "cores-arm64.tar.gz" --dir .
          gh release download toolchains --pattern "cores-armhf.tar.gz" --dir .

      - name: Load Docker images
        run: |
          gunzip -c cores-arm64.tar.gz | docker load
          gunzip -c cores-armhf.tar.gz | docker load

      - name: Build armhf
        run: |
          mkdir -p output/cores
          docker run --rm -v ${{ github.workspace }}/output:/output cores-armhf \
            bash -c '
              set -e
              ./libretro-fetch.sh uae4arm
              REF="${{ inputs.core_ref }}"
              if [ -n "$REF" ]; then
                git -C libretro-uae4arm fetch origin "$REF"
                git -C libretro-uae4arm checkout --detach FETCH_HEAD
                git -C libretro-uae4arm submodule update --init --recursive
              fi
              # The pinned commit predates Makefile.libretro, which libretro-super now expects.
              mk=Makefile.libretro; [ -f libretro-uae4arm/$mk ] || mk=Makefile
              # GCC 13 libstdc++ linked in and hidden: 32-bit RetroArch on some devices has an older one.
              make -C libretro-uae4arm -f $mk platform=unix -j"$(nproc)" CC="$HOST_CC-gcc" CXX="$HOST_CC-g++" \
                LDFLAGS="-lpthread -static-libstdc++ -static-libgcc -Wl,--exclude-libs,ALL"
              cp libretro-uae4arm/uae4arm_libretro.so /output/cores/
            '
      - name: Grab info file
        run: |
          docker run --rm -v ${{ github.workspace }}/output:/output cores-arm64 \
            bash -c 'mkdir -p /output/info && cp dist/info/uae4arm_libretro.info /output/info/ 2>/dev/null || true'

      - uses: actions/download-artifact@v4
        with:
          name: uae4arm-arm64
          path: output/cores64

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          CONTENTS=""
          [ -f cores64/uae4arm_libretro.so ] && CONTENTS="$CONTENTS cores64/"
          [ -f cores/uae4arm_libretro.so ] && CONTENTS="$CONTENTS cores/"
          [ -f info/uae4arm_libretro.info ] && CONTENTS="$CONTENTS info/"
          if [ -n "$CONTENTS" ]; then
            zip -r uae4arm_libretro.zip $CONTENTS
            gh release upload "beta-${{ github.ref_name }}" uae4arm_libretro.zip --clobber
          else
            echo "::error::No builds succeeded for uae4arm"
            exit 1
          fi
