name: Build squirreljme

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core git ref (commit/tag/branch); default: the commit cores-experimental tested, blank for latest'
        default: 'c8de2e47c2994f1c36215dd29d44fecf086f25ca'
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: 'c8de2e47c2994f1c36215dd29d44fecf086f25ca'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      - name: Download Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download toolchains --pattern "cores-arm64.tar.gz" --dir .
          gh release download toolchains --pattern "cores-armhf.tar.gz" --dir .

      - name: Load Docker images
        run: |
          gunzip -c cores-arm64.tar.gz | docker load
          gunzip -c cores-armhf.tar.gz | docker load

      - name: Build armhf
        run: |
          mkdir -p output/cores
          docker run --rm -v ${{ github.workspace }}/output:/output -v ${{ github.workspace }}/patches:/patches cores-armhf \
            bash -c '
              set -e
              ./libretro-fetch.sh squirreljme
              REF="${{ inputs.core_ref }}"
              if [ -n "$REF" ]; then
                git -C libretro-squirreljme fetch origin "$REF"
                git -C libretro-squirreljme checkout --detach FETCH_HEAD
                git -C libretro-squirreljme submodule update --init --recursive
              fi
              for p in system-map-arm32-or decode-host-cc sourceize-host-cc; do
                git -C libretro-squirreljme apply --reverse --check /patches/squirreljme/$p.patch 2>/dev/null ||
                  git -C libretro-squirreljme apply /patches/squirreljme/$p.patch
              done
              cmake -S libretro-squirreljme/nanocoat -B build-squirreljme -DCMAKE_BUILD_TYPE=Release \
                -DSQUIRRELJME_ENABLE_FRONTEND_LIBRETRO=ON
              cmake --build build-squirreljme --target squirreljme_libretro -j"$(nproc)"
              cp build-squirreljme/bin/squirreljme_libretro.so /output/cores/
            '
      - name: Grab info file
        run: |
          docker run --rm -v ${{ github.workspace }}/output:/output cores-arm64 \
            bash -c 'mkdir -p /output/info && cp dist/info/squirreljme_libretro.info /output/info/ 2>/dev/null || true'

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          CONTENTS=""
          [ -f cores64/squirreljme_libretro.so ] && CONTENTS="$CONTENTS cores64/"
          [ -f cores/squirreljme_libretro.so ] && CONTENTS="$CONTENTS cores/"
          [ -f info/squirreljme_libretro.info ] && CONTENTS="$CONTENTS info/"
          if [ -n "$CONTENTS" ]; then
            zip -r squirreljme_libretro.zip $CONTENTS
            gh release upload "beta-${{ github.ref_name }}" squirreljme_libretro.zip --clobber
          else
            echo "::error::No builds succeeded for squirreljme"
            exit 1
          fi
