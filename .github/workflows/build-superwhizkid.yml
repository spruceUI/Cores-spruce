name: Build superwhizkid

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'superwhizkid git ref (commit/tag/branch, blank for latest)'
        default: ''
  workflow_call:
    inputs:
      core_ref:
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Core builds from ${{ github.ref_name }}" \
            || true

      - name: Download Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download toolchains --pattern "cores-arm64.tar.gz" --dir .
          gh release download toolchains --pattern "cores-armhf.tar.gz" --dir .

      - name: Load Docker images
        run: |
          gunzip -c cores-arm64.tar.gz | docker load
          gunzip -c cores-armhf.tar.gz | docker load

      - name: Clone superwhizkid
        run: |
          git clone https://github.com/ryanmsartor/superwhizkid.git
          REF="${{ inputs.core_ref }}"
          if [ -n "$REF" ]; then
            git -C superwhizkid checkout "$REF"
          fi
          mkdir -p output/info
          cp superwhizkid/libretro/superwhizkid_libretro.info output/info/

      - name: Build arm64
        run: |
          mkdir -p output/cores64
          docker run --rm \
            -v ${{ github.workspace }}/superwhizkid:/src \
            -w /src \
            cores-arm64 \
            bash -c '
              set -euo pipefail
              cmake -S . -B build-arm64 -DCMAKE_BUILD_TYPE=Release
              cmake --build build-arm64 --parallel "$(nproc)" --target superwhizkid_libretro
            '
          cp superwhizkid/build-arm64/superwhizkid_libretro.so output/cores64/

      - name: Build armhf
        run: |
          mkdir -p output/cores
          docker run --rm \
            -v ${{ github.workspace }}/superwhizkid:/src \
            -w /src \
            cores-armhf \
            bash -c '
              set -euo pipefail
              cmake -S . -B build-armhf -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="-mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard"
              cmake --build build-armhf --parallel "$(nproc)" --target superwhizkid_libretro
            '
          cp superwhizkid/build-armhf/superwhizkid_libretro.so output/cores/

      - name: Check architectures and glibc floors
        run: |
          newest_glibc() {
            objdump -T "$1" 2>/dev/null \
              | grep -o 'GLIBC_[0-9.]*' \
              | sort -Vu \
              | tail -1 \
              || true
          }

          require_floor() {
            file_path=$1
            maximum=$2
            newest=$(newest_glibc "$file_path")
            echo "$file_path: newest glibc symbol is ${newest:-none} (maximum GLIBC_$maximum)"
            if [ -n "$newest" ]; then
              version=${newest#GLIBC_}
              if [ "$(printf '%s\n%s\n' "$version" "$maximum" | sort -V | tail -1)" != "$maximum" ]; then
                echo "::error::$file_path requires $newest, newer than GLIBC_$maximum"
                exit 1
              fi
            fi
          }

          file output/cores64/superwhizkid_libretro.so | grep -Eqi 'aarch64|ARM aarch64' || {
            echo "::error::arm64 build is not aarch64"
            exit 1
          }
          file output/cores/superwhizkid_libretro.so | grep -q 'ARM, EABI5' || {
            echo "::error::armhf build is not 32-bit ARM"
            exit 1
          }
          require_floor output/cores64/superwhizkid_libretro.so 2.31
          require_floor output/cores/superwhizkid_libretro.so 2.23

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          CONTENTS=""
          [ -f cores64/superwhizkid_libretro.so ] && CONTENTS="$CONTENTS cores64/"
          [ -f cores/superwhizkid_libretro.so ] && CONTENTS="$CONTENTS cores/"
          [ -f info/superwhizkid_libretro.info ] && CONTENTS="$CONTENTS info/"
          if [ -f cores64/superwhizkid_libretro.so ] || [ -f cores/superwhizkid_libretro.so ]; then
            zip -r superwhizkid_libretro.zip $CONTENTS
            gh release upload "beta-${{ github.ref_name }}" superwhizkid_libretro.zip --clobber
          else
            echo "::error::No builds succeeded for superwhizkid"
            exit 1
          fi
